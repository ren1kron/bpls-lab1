spring.application.name=creative-worker
spring.main.web-application-type=none
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jackson.default-property-inclusion=non_null
app.kafka.creative-worker.enabled=${APP_KAFKA_CREATIVE_WORKER_ENABLED:true}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.upload-request-topic=${CREATIVE_UPLOAD_REQUEST_TOPIC:creative-upload-requests}
app.kafka.upload-result-topic=${CREATIVE_UPLOAD_RESULT_TOPIC:creative-upload-results}
app.kafka.worker-group-id=${CREATIVE_UPLOAD_WORKER_GROUP_ID:creative-upload-workers}
app.kafka.producer-client-id=${CREATIVE_UPLOAD_PRODUCER_CLIENT_ID:creative-worker-outbox}
app.eis.enabled=${EIS_ENABLED:false}
app.eis.connection-factory-jndi-name=${EIS_CONNECTION_FACTORY_JNDI_NAME:java:/eis/OneCConnectionFactory}
app.eis.fail-on-error=${EIS_FAIL_ON_ERROR:false}
app.camunda.enabled=${CAMUNDA_ENABLED:false}
app.camunda.identity-sync-enabled=${CAMUNDA_IDENTITY_SYNC_ENABLED:false}
app.camunda.external-task-worker-enabled=false
app.camunda.base-url=${CAMUNDA_BASE_URL:http://localhost:8080/engine-rest}
app.camunda.username=${CAMUNDA_USERNAME:demo}
app.camunda.password=${CAMUNDA_PASSWORD:demo}
app.camunda.worker-id=${CAMUNDA_WORKER_ID:lab1-creative-worker}
app.camunda.max-tasks=${CAMUNDA_MAX_TASKS:8}
app.camunda.async-response-timeout-ms=${CAMUNDA_ASYNC_RESPONSE_TIMEOUT_MS:1000}
app.camunda.lock-duration-ms=${CAMUNDA_LOCK_DURATION_MS:30000}
app.camunda.failure-retries=${CAMUNDA_FAILURE_RETRIES:3}
app.camunda.retry-timeout-ms=${CAMUNDA_RETRY_TIMEOUT_MS:10000}

app.atomikos.default-jta-timeout-seconds=60
app.atomikos.datasource.unique-resource-name=lab1WorkerDataSource
app.atomikos.datasource.min-pool-size=1
app.atomikos.datasource.max-pool-size=10
app.atomikos.datasource.borrow-connection-timeout=30
app.atomikos.datasource.xa-data-source-class-name=org.postgresql.xa.PGXADataSource
app.atomikos.datasource.xa-properties.URL=${DB_URL:jdbc:postgresql://localhost:6262/lab1}
app.atomikos.datasource.xa-properties.user=${DB_USERNAME:lab1}
app.atomikos.datasource.xa-properties.password=${DB_PASSWORD:lab1}
app.atomikos.creative-datasource.unique-resource-name=lab1WorkerCreativeDataSource
app.atomikos.creative-datasource.min-pool-size=1
app.atomikos.creative-datasource.max-pool-size=10
app.atomikos.creative-datasource.borrow-connection-timeout=30
app.atomikos.creative-datasource.xa-data-source-class-name=org.postgresql.xa.PGXADataSource
app.atomikos.creative-datasource.xa-properties.URL=${CREATIVE_DB_URL:jdbc:postgresql://localhost:6263/lab1_creatives}
app.atomikos.creative-datasource.xa-properties.user=${CREATIVE_DB_USERNAME:lab1_creatives}
app.atomikos.creative-datasource.xa-properties.password=${CREATIVE_DB_PASSWORD:lab1_creatives}
