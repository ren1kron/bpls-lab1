spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.task.scheduling.enabled=false
spring.quartz.auto-startup=false
app.timers.fixed-delay-ms=600000
app.atomikos.default-jta-timeout-seconds=60
app.atomikos.datasource.unique-resource-name=lab1TestDataSource
app.atomikos.datasource.xa-data-source-class-name=org.h2.jdbcx.JdbcDataSource
app.atomikos.datasource.xa-properties.URL=jdbc:h2:mem:lab1;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.atomikos.datasource.xa-properties.user=sa
app.atomikos.datasource.xa-properties.password=
app.atomikos.creative-datasource.unique-resource-name=lab1CreativeTestDataSource
app.atomikos.creative-datasource.xa-data-source-class-name=org.h2.jdbcx.JdbcDataSource
app.atomikos.creative-datasource.xa-properties.URL=jdbc:h2:mem:lab1_creatives;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.atomikos.creative-datasource.xa-properties.user=sa
app.atomikos.creative-datasource.xa-properties.password=
app.security.jwt.secret=test-jwt-secret
app.security.jwt.ttl-seconds=3600
app.security.bootstrap.moderator.enabled=true
app.security.bootstrap.moderator.username=moderator
app.security.bootstrap.moderator.password=moderator
app.yookassa.enabled=false
