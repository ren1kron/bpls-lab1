app.atomikos.datasource.xa-properties.URL=jdbc:h2:mem:lab1;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.atomikos.datasource.xa-properties.user=sa
app.atomikos.datasource.xa-properties.password=
