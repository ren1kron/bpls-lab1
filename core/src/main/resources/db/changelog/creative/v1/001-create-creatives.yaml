databaseChangeLog:
  - changeSet:
      id: creative-001-create-creatives
      author: lab1-app
      changes:
        - createTable:
            tableName: creatives
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: campaign_id
                  type: bigint
                  constraints:
                    nullable: false
