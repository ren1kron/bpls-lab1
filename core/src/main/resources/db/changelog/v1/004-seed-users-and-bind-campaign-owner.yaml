databaseChangeLog:
  - changeSet:
      id: 004-seed-users-and-bind-campaign-owner
      author: lab1-app
      changes:
        - addColumn:
            tableName: campaigns
            columns:
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: campaigns
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_campaigns_owner
