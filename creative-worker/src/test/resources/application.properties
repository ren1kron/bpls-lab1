spring.jpa.hibernate.ddl-auto=none
spring.main.web-application-type=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
app.kafka.creative-worker.enabled=false
app.atomikos.default-jta-timeout-seconds=60
app.atomikos.datasource.unique-resource-name=lab1WorkerTestDataSource
app.atomikos.datasource.xa-data-source-class-name=org.h2.jdbcx.JdbcDataSource
app.atomikos.datasource.xa-properties.URL=jdbc:h2:mem:lab1_worker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.atomikos.datasource.xa-properties.user=sa
app.atomikos.datasource.xa-properties.password=
app.atomikos.creative-datasource.unique-resource-name=lab1CreativeWorkerTestDataSource
app.atomikos.creative-datasource.xa-data-source-class-name=org.h2.jdbcx.JdbcDataSource
app.atomikos.creative-datasource.xa-properties.URL=jdbc:h2:mem:lab1_creatives_worker;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
app.atomikos.creative-datasource.xa-properties.user=sa
app.atomikos.creative-datasource.xa-properties.password=
